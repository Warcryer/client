name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch or commit to test against"
        type: string
        default: main

# Who can put code on players' PCs. An installed app accepts an update only if
# it is signed with the project's update key, so that key is the thing to
# guard. It lives in the "release" environment, which only a version tag can
# use and only after the owner approves the run on GitHub. Every other build
# (each push to main) is signed with a throwaway key made for that run, so
# that it can be tested as an update without the real key being involved.
#
# The other signature is Windows' own (code signing): it says who published the
# program, and without it Windows warns on every install. It is made with a
# certificate kept in Azure Artifact Signing, whose key never leaves Azure. A
# tagged build signs in to Azure with a pass GitHub gives only to runs of the
# "release" environment (no password is stored anywhere), and signs the app, the
# uninstaller and the installer. Other builds are not code-signed.
#
# The actions below are pinned to exact commits: a tag such as @v4 can be
# moved by whoever controls that repository, a commit cannot. To update one,
# look up the commit of its new version and change the line.
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest   # a GitHub-hosted runner: a clean machine for every build
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      actions: read
      id-token: write   # the pass with which a tagged build signs in to Azure; of no use to any other build
    outputs:
      signed: ${{ steps.codesign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A release is built from main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::This tag is not on main. Releases are built only from commits on main."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, as of 2026-11-17
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The installer is also the update package. Its signature (the .sig file)
      # is checked by installed apps against the key built into them.
      #
      # A tagged build: the project's update key, which this job only receives
      # once the owner has approved the run.
      - name: The project's update key (tagged builds, after approval)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__END_OF_KEY__"
            echo "$KEY"
            echo "__END_OF_KEY__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
      # Any other build: a key made here and thrown away with the machine. The
      # app is built to trust that key instead, so the update test still works,
      # and nothing signed here would be accepted by an app players have.
      - name: A throwaway key (every other build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          npx tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key" > /dev/null
          PUB="$RUNNER_TEMP/throwaway.key.pub" node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins.updater.pubkey=fs.readFileSync(process.env.PUB,'utf8').trim();fs.writeFileSync(f,JSON.stringify(c,null,2))"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/throwaway.key")"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
            # The app shows that it is a test build, and of which commit (Settings, beside the version).
            echo "VITE_BUILD_LABEL=test ${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"
      # Code signing, on a tagged build once the release environment names a signing account (its variables
      # SIGNING_ENDPOINT, SIGNING_ACCOUNT and SIGNING_PROFILE, and its secrets AZURE_CLIENT_ID,
      # AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID, which are identifiers, not passwords).
      - name: Sign in to Azure (tagged builds, after approval)
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: The signing tools, and a trial signature
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: ./scripts/signing-setup.ps1
      - name: A release without a code signature
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT == ''
        shell: bash
        run: echo "::warning::The release environment names no signing account (SIGNING_ACCOUNT), so this release is not code-signed."
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SIGN_CONFIG:-}" ]; then
            npx tauri build --config "$SIGN_CONFIG"
          else
            npx tauri build
          fi
      # What was built is what is published, so it is looked at here: the installer, and the app as the
      # installer holds it (unpacked with 7-Zip), must carry a signature Windows accepts.
      - name: The installer and the app are signed
        id: codesign
        shell: pwsh
        run: |
          if (-not $env:SIGN_CONFIG) { "signed=false" >> $env:GITHUB_OUTPUT; exit 0 }
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $inside = Join-Path $env:RUNNER_TEMP "inside-installer"
          & 7z x $installer "-o$inside" -y | Out-Null
          $app = Get-ChildItem $inside -Recurse -Filter warcryer.exe | Select-Object -First 1
          if (-not $app) { Write-Host "::error::warcryer.exe was not found inside the installer."; exit 1 }
          $files = @($installer, $app.FullName)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid") { Write-Host "::error::$f is not signed as it should be: $($sig.Status), $($sig.StatusMessage)"; exit 1 }
            if (-not $sig.TimeStamperCertificate) { Write-Host "::error::$f carries no time stamp, so its signature would stop counting in three days."; exit 1 }
            Write-Host "$(Split-Path $f -Leaf): signed by $($sig.SignerCertificate.Subject)"
          }
          "signed=true" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
      # Cargo.lock pins the exact version of every Rust dependency, so the same
      # commit always builds from the same code. Rust is only ever built here,
      # so this is also where a changed lock file comes from: it is kept with
      # the run, to be committed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Cargo.lock matches the repository
        shell: bash
        run: |
          if ! git ls-files --error-unmatch src-tauri/Cargo.lock > /dev/null 2>&1; then
            echo "::warning::src-tauri/Cargo.lock is not committed yet. Download the cargo-lock file from this run and commit it."
          elif ! git diff --quiet -- src-tauri/Cargo.lock; then
            git diff --stat -- src-tauri/Cargo.lock
            echo "::error::This build changed src-tauri/Cargo.lock (a dependency or the version changed). Download the cargo-lock file from this run, commit it as src-tauri/Cargo.lock, and build again."
            exit 1
          fi
      # Only for the test: the same code numbered 0.0.1. The test installs it
      # and then delivers the real build to it as an update. Its signature is
      # not kept, so it can never be offered to anyone as an update itself, and
      # it is not code-signed.
      - name: Build an old-numbered copy for the update test
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='0.0.1';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx tauri build
          mkdir update-base
          cp src-tauri/target/release/bundle/nsis/*_0.0.1_x64-setup.exe update-base/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-base
          path: update-base/*.exe
          if-no-files-found: error
          retention-days: 3

  # Installs that installer on a clean Windows machine and uses the app.
  test:
    needs: build
    uses: ./.github/workflows/test-windows.yml
    with:
      backend_ref: ${{ inputs.backend_ref || 'main' }}
    secrets:
      BACKEND_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY }}

  # A tagged build is published only if the installed app passed its test.
  #
  # A plain version tag (v1.2.3) becomes the latest release, and installed apps
  # update to it by themselves. A tag with a suffix (v1.2.3-rc.1) is published
  # as a pre-release, which is never offered as an update.
  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the release; no other job can write to the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: installer
      - name: Write the update list (latest.json)
        run: |
          set -euo pipefail
          exe=$(ls installer/*.exe | head -1)
          name=$(basename "$exe")
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${name// /.}" \
            --rawfile sig "$exe.sig" \
            '{version: $version, notes: "", pub_date: $date, platforms: {"windows-x86_64": {signature: ($sig | gsub("\\s+$"; "")), url: $url}}}' \
            > installer/latest.json
          cat installer/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            notes="Code-signed. A new publisher has no standing with Windows SmartScreen yet, so for a while it may still show a notice on a first install: choose More info, then Run anyway. This build passed the automated test of the installed app on Windows."
          else
            notes="Not code-signed yet, so Windows SmartScreen warns on a first install: choose More info, then Run anyway. This build passed the automated test of the installed app on Windows."
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" installer/*.exe installer/*.sig installer/latest.json -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --prerelease --notes "Test build; not offered as an automatic update. $notes"
          else
            gh release create "$GITHUB_REF_NAME" installer/*.exe installer/*.sig installer/latest.json -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --latest --notes "Installed copies of the app (0.8.0 and later) update to this version by themselves. $notes"
          fi
